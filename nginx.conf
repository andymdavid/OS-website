server {
    listen 80;
    server_name gitea.pages.otherstuff.ai;

    return 301 https://otherstuff.ai$request_uri;
}

server {
    listen 80;
    server_name www.otherstuff.ai;

    return 301 https://otherstuff.ai$request_uri;
}

server {
    listen 80 default_server;
    server_name otherstuff.ai;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    port_in_redirect off;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;
    error_page 404 /404.html;

    location = /marginal-gains { return 301 /ai-automation/$is_args$args; }
    location = /marginal-gains/ { return 301 /ai-automation/$is_args$args; }

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Content-hashed delivery assets may be cached safely across releases.
    location /media/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Display-sized images and local fonts have stable names; allow a week of
    # reuse without claiming they are immutable like Astro's fingerprinted files.
    location ~ ^/(fonts|optimized)/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # NStack is a self-contained static site; keep relative assets under its prefix.
    location = /nstack {
        return 308 /nstack/$is_args$args;
    }

    location = /nstack/assets/InterVariable.ttf {
        types { font/ttf ttf; }
        try_files $uri =404;
    }

    # Proxy API requests to Node server
    location /api/ {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        proxy_hide_header Cache-Control;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Referer $http_referer;
    }

    # Serve prerendered route HTML without forcing a trailing-slash redirect
    # and return a real 404 for unknown paths instead of the homepage.
    # Short cache for HTML so updated content gets indexed quickly
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Cache static assets
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

server {
    listen 80;
    server_name otherstuff.studio www.otherstuff.studio;

    return 301 https://otherstuff.ai$request_uri;
}
